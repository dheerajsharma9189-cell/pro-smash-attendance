<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A56DB">
<title>Pro Smash Attendance – Login</title>
<meta name="description" content="Pro Smash Badminton Academy staff login: daily attendance, month register and WhatsApp reports for parents.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Pro Smash Badminton Academy">
<meta property="og:title" content="Pro Smash Attendance – Login">
<meta property="og:description" content="Staff login: daily attendance, month register and WhatsApp reports for parents.">
<meta property="og:url" content="https://dheerajsharma9189-cell.github.io/pro-smash-attendance/">
<meta property="og:image" content="https://dheerajsharma9189-cell.github.io/pro-smash-attendance/icon-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="twitter:card" content="summary">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Attendance">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* White + blue, one look on every device. Layout: blue header, one column, bottom tabs, bottom sheets for forms. */
:root{
  --bg:#FFFFFF; --surface:#F3F6FC; --card:#FFFFFF; --ink:#0F1B3D; --muted:#5A6A8A; --line:#DCE3F0; --line-soft:#EBF0F8;
  --blue:#1A56DB; --blue-dark:#1442AE; --blue-soft:#E7EEFF; --on-blue:#FFFFFF;
  --ok:#11804A; --ok-soft:#E1F4E9; --bad:#CC3333; --bad-soft:#FCE6E6; --warn:#A35F00; --warn-soft:#FFF1D9;
  --wa:#169C55; --bubble:#DCF7C5; --chat:#EFEAE2; --scrim:rgba(10,20,45,.45);
  --shadow:0 1px 2px rgba(15,27,61,.06),0 8px 24px rgba(15,27,61,.10);
  --font:"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans Devanagari","Nirmala UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--surface);color:var(--ink)}
body{font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
[hidden]{display:none!important}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{background:var(--blue);color:var(--on-blue);padding-top:env(safe-area-inset-top,0px)}
.top-in{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding-block:16px 18px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.top h1{font-size:clamp(21px,5.6vw,28px);font-weight:800;letter-spacing:-.01em;line-height:1.15;margin-top:3px;overflow-wrap:anywhere}
.top-sub{color:var(--on-blue);opacity:.88;font-size:13.5px;margin-top:4px}
.icon-btn{flex:none;width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:var(--on-blue);display:grid;place-items:center}

main{padding-block:16px calc(92px + env(safe-area-inset-bottom,0px))}
.view{display:grid;gap:14px}
.view>*{min-width:0}

/* pieces */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{font-size:17px;font-weight:750}
.hint{font-size:13px;color:var(--muted)}
.big{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.big small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.bar{height:8px;border-radius:9px;background:var(--line-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:9px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--muted)}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:8px 16px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:650;font-size:14.5px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#FFFFFF}
.btn.wa-line{color:var(--wa);border-color:var(--ok-soft)}
.btn.small{min-height:34px;padding:5px 12px;font-size:13.5px;border-radius:9px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--blue)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.danger-solid{background:var(--bad);border-color:var(--bad);color:#FFFFFF}
.btn.block{width:100%;min-height:48px;font-size:15.5px}
.btn:disabled,a.btn.off{opacity:.45;pointer-events:none}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}

.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.neutral{background:var(--line-soft);color:var(--muted)}

.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:1px 2px 3px;margin-inline:-2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:650;color:var(--ink)}
.chip span{color:var(--muted);font-weight:600;margin-left:5px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.chip[aria-pressed="true"] span{color:var(--on-blue);opacity:.8}

.switch{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px}
.switch .nav{width:42px;height:42px;flex:none;border-radius:10px;border:0;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center}
.switch .nav:disabled{opacity:.35;cursor:default}
.switch-mid{flex:1;min-width:0;text-align:center;display:grid}
.switch-mid b{font-size:18px;font-weight:750}
.switch-mid input{border:0;background:transparent;text-align:center;color:var(--muted);font-weight:600;font-size:14px;min-height:26px;width:100%;padding:0}

.rows{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line-soft);min-width:0}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left;color:inherit}
.row-text{min-width:0;display:grid;gap:1px}
.row-text b{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-end{display:flex;align-items:center;gap:8px;flex:none}
.av{width:42px;height:42px;flex:none;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:15px}

.pa{display:flex;gap:6px;flex:none}
.pa button{width:44px;height:44px;border-radius:11px;border:1.5px solid var(--line);background:var(--card);font-weight:800;font-size:16px;color:var(--muted)}
.pa button[data-v="P"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#FFFFFF}
.pa button[data-v="A"][aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#FFFFFF}
.wa-mini{width:36px;height:36px;border-radius:10px;border:1px solid var(--ok-soft);display:grid;place-items:center;color:var(--wa);background:var(--card);flex:none}

.empty{text-align:center;padding:26px 16px;color:var(--muted);display:grid;gap:10px;justify-items:center}
.empty h3{color:var(--ink);font-size:18px}
.notice{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.notice.warn{border-color:#F2C97A;background:var(--warn-soft)}
.notice p{font-size:14px;min-width:0;flex:1 1 220px}

/* register grid */
.reg-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;-webkit-overflow-scrolling:touch}
table.reg{border-collapse:separate;border-spacing:0;font-size:12px;font-variant-numeric:tabular-nums;min-width:100%}
.reg th,.reg td{padding:0;text-align:center;border-bottom:1px solid var(--line-soft);height:34px;min-width:27px}
.reg tbody tr:last-child th,.reg tbody tr:last-child td{border-bottom:0}
.reg thead th{background:var(--blue-soft);color:var(--blue-dark);font-weight:700;height:42px;line-height:1.05;border-bottom:1px solid var(--line)}
.reg thead th small{display:block;font-size:9.5px;font-weight:600;opacity:.8;margin-top:2px}
.reg thead th.today{background:var(--blue);color:var(--on-blue)}
.reg .nm{position:sticky;left:0;z-index:1;background:var(--card);text-align:left;padding:0 10px;min-width:116px;max-width:146px;border-right:1px solid var(--line)}
.reg thead .nm{background:var(--blue-soft);z-index:2}
.reg .nm b{display:block;font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.reg td.P{background:var(--ok-soft);color:var(--ok);font-weight:800}
.reg td.A{background:var(--bad-soft);color:var(--bad);font-weight:800}
.reg td.off,.reg th.off{background:#F7F9FD}
.reg thead th.off{background:#F0F3FA;color:#9AA6BF}
.reg .tot{padding:0 9px;font-weight:750;border-left:1px solid var(--line);white-space:nowrap}
.reg th button{border:0;background:none;font:inherit;color:inherit;width:100%;height:100%;padding:0}
.key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.key i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;background:none;border:0;color:var(--muted);font-size:12px;font-weight:650}
.tab[aria-current="page"]{color:var(--blue)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{left:50%;right:auto;width:620px;transform:translateX(-50%);bottom:24px;border-radius:20px;max-height:calc(100% - 48px)}}
.sheet-in{max-width:620px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.sheet-in>*{min-width:0}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;background:var(--surface);padding-block:14px 6px;z-index:2}
.sheet-h h2{font-size:20px;font-weight:800;min-width:0;overflow-wrap:anywhere}
.x{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--ink)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
form{display:grid;gap:14px}
.field{display:grid;gap:6px;min-width:0}
.inp{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card);font-size:16px}
textarea.inp{min-height:84px;resize:vertical}
.grid2{display:grid;gap:14px}
@media (min-width:480px){.grid2{grid-template-columns:1fr 1fr}}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--line-soft);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;min-height:38px;font-weight:650;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--blue);box-shadow:0 1px 3px rgba(15,27,61,.12)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat3>div{background:var(--card);padding:10px 12px;display:grid;gap:1px;min-width:0}
.stat3 b{font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.chat{background:var(--chat);border-radius:16px;padding:14px}
.bubble{background:var(--bubble);color:#0B1F12;border-radius:4px 14px 14px 14px;padding:11px 13px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;line-height:1.45}
.confirm{border:1px solid var(--bad);background:var(--bad-soft);border-radius:14px;padding:14px;display:grid;gap:10px}
.batch-row{display:grid;grid-template-columns:1fr 1fr 40px;gap:8px;align-items:center}
.batch-row .x{width:40px;height:40px;border-radius:10px}
.install{display:flex;gap:12px;align-items:center;background:var(--blue-soft);border:1px solid #C9D7FB;border-radius:16px;padding:12px 14px}
.install img{width:48px;height:48px;border-radius:12px;flex:none}
.install .txt{flex:1;min-width:0;display:grid;gap:2px}
.install .txt b{font-size:15px}
.install .txt span{font-size:13px;color:var(--muted)}
.install .btns{display:flex;flex-direction:column;gap:6px;flex:none}
/* lock + setup screens */
.top-btns{display:flex;gap:8px;flex:none}
.sync{display:inline-flex;align-items:center;gap:6px;margin-left:6px;padding:1px 9px;border-radius:999px;background:rgba(255,255,255,.16);font-size:12px;font-weight:700;white-space:nowrap;vertical-align:1px}
.sync i{width:7px;height:7px;border-radius:50%;background:#7CF0A8}
.sync.wait i{background:#FFD36B}.sync.off i{background:#FF9C9C}.sync.local i{background:#CFE0FF}
.gate{position:fixed;inset:0;z-index:80;background:var(--surface);overflow-y:auto;overscroll-behavior:contain}
.gate-in{max-width:460px;margin:0 auto;min-height:100%;padding:calc(28px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.gate-logo{width:72px;height:72px;border-radius:18px;align-self:center}
.gate h2{font-size:24px;font-weight:800;text-align:center;line-height:1.2}
.gate .lead{text-align:center;color:var(--muted)}
.choice{display:grid;gap:4px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;color:var(--ink)}
.choice b{font-size:16.5px}.choice span{font-size:14px;color:var(--muted)}
.choice.main{border-color:var(--blue);background:var(--blue-soft)}
.dots{display:flex;justify-content:center;gap:16px;margin:8px 0 2px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--blue);display:block}
.dots i.on{background:var(--blue)}
.dots.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pin-msg{min-height:22px;text-align:center;font-weight:650;font-size:14px;color:var(--bad)}
.pin-msg.info{color:var(--muted)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;width:100%;margin:0 auto}
.pad button{height:64px;border-radius:18px;border:1px solid var(--line);background:var(--card);font-size:26px;font-weight:700;color:var(--ink)}
.pad button.plain{background:transparent;border-color:transparent;font-size:14px;font-weight:650;color:var(--blue)}
.pad button:active{background:var(--blue-soft)}
.steps-list{display:grid;gap:12px;counter-reset:st;margin:0;padding:0;list-style:none}
.steps-list li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px 12px 52px;position:relative;font-size:14.5px}
.steps-list li::before{counter-increment:st;content:counter(st);position:absolute;left:14px;top:12px;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#FFFFFF;font-weight:800;font-size:14px;display:grid;place-items:center}
.steps-list li > b:first-child{display:block;margin-bottom:2px}
.code-box{width:100%;height:90px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface);resize:none}
.qr-wrap{display:grid;justify-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.qr-wrap canvas{width:220px;height:220px;image-rendering:pixelated}
.link-box{font-size:12.5px;color:var(--muted);word-break:break-all;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:#FFFFFF;padding:11px 16px;border-radius:12px;font-weight:650;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <div style="min-width:0">
      <p class="eyebrow">Attendance register</p>
      <h1 id="h-name">Pro Smash Badminton Academy</h1>
      <p class="top-sub"><span id="h-sub"></span><span class="sync" id="sync" hidden></span></p>
    </div>
    <div class="top-btns"><button class="icon-btn" data-act="lock-now" aria-label="Lock the app" id="btn-lock"></button><button class="icon-btn" data-act="settings" aria-label="Settings and backup" id="btn-settings"></button></div>
  </div>
</header>

<main class="wrap">
  <section class="view" data-view="mark" id="v-mark">
    <div id="install-note"></div>
    <div id="backup-note"></div>
    <div class="switch">
      <button class="nav" data-act="day-prev" aria-label="Previous day" id="d-prev"></button>
      <div class="switch-mid"><b id="d-label">Today</b><input type="date" id="d-input" aria-label="Date"></div>
      <button class="nav" data-act="day-next" aria-label="Next day" id="d-next"></button>
    </div>
    <div class="chips" id="mark-chips" role="group" aria-label="Batch"></div>
    <div id="mark-sum"></div>
    <div id="mark-list"></div>
  </section>

  <section class="view" data-view="reg" id="v-reg" hidden>
    <div class="switch">
      <button class="nav" data-act="reg-prev" aria-label="Previous month" id="r-prev"></button>
      <div class="switch-mid"><span class="lbl">Month register</span><b id="r-label"></b></div>
      <button class="nav" data-act="reg-next" aria-label="Next month" id="r-next"></button>
    </div>
    <div class="chips" id="reg-chips" role="group" aria-label="Batch"></div>
    <div id="reg-body" class="view"></div>
  </section>

  <section class="view" data-view="send" id="v-send" hidden>
    <div class="switch">
      <button class="nav" data-act="send-prev" aria-label="Previous month" id="s-prev"></button>
      <div class="switch-mid"><span class="lbl">Send to parents</span><b id="s-label"></b></div>
      <button class="nav" data-act="send-next" aria-label="Next month" id="s-next"></button>
    </div>
    <div class="chips" id="send-chips" role="group" aria-label="Batch"></div>
    <div id="send-body" class="view"></div>
  </section>

  <section class="view" data-view="students" id="v-students" hidden>
    <div class="btn-row"><button class="btn primary" data-act="add-student" style="flex:1">+ Add student</button><button class="btn" data-act="add-many" style="flex:1">Add many at once</button></div>
    <input class="inp" id="q" type="search" placeholder="Search name or phone" aria-label="Search students" autocomplete="off">
    <div class="chips" id="stu-chips" role="group" aria-label="Batch"></div>
    <div id="stu-list"></div>
  </section>
</main>

<nav class="tabbar" aria-label="Sections">
  <div class="tabs">

<script>
(function () {
"use strict";
/* ================= helpers ================= */
var $ = function (s) { return document.querySelector(s); };
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
function pad(n) { return String(n).padStart(2, '0'); }
function dstr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
var TODAY = dstr(new Date()), CUR = TODAY.slice(0, 7);
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
var MONTH = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
var MONTH_HI = ['जनवरी', 'फ़रवरी', 'मार्च', 'अप्रैल', 'मई', 'जून', 'जुलाई', 'अगस्त', 'सितंबर', 'अक्टूबर', 'नवंबर', 'दिसंबर'];
var DAY = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
function parseD(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function addDays(s, k) { var d = parseD(s); d.setDate(d.getDate() + k); return dstr(d); }
function addMonths(m, k) { var p = m.split('-').map(Number), y = p[0], mo = p[1] + k; while (mo > 12) { mo -= 12; y++; } while (mo < 1) { mo += 12; y--; } return y + '-' + pad(mo); }
function lastDay(m) { var p = m.split('-').map(Number); return new Date(p[0], p[1], 0).getDate(); }
function mLabel(m) { var p = m.split('-').map(Number); return MONTH[p[1] - 1] + ' ' + p[0]; }
function mLabelHi(m) { var p = m.split('-').map(Number); return MONTH_HI[p[1] - 1] + ' ' + p[0]; }
function fmtDate(s) { var d = parseD(s); return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); }
function initials(n) { return String(n || '?').trim().split(/\s+/).slice(0, 2).map(function (w) { return w[0] || ''; }).join('').toUpperCase() || '?'; }
function rid(p) { return (p || 's') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function firstName(n) { return String(n || '').trim().split(/\s+/)[0]; }
var ICON = {
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  grid: '<rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M3.5 14.5h17M9 4.5v15M14.5 4.5v15"/>',
  send: '<path d="M4 20l1.3-3.9A8 8 0 1 1 8 19.2Z"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M15.5 4.8a3.5 3.5 0 0 1 0 6.4"/><path d="M18 14.8c1.9.8 3.1 2.6 3.5 5.2"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>',
  left: '<path d="m15 18-6-6 6-6"/>', right: '<path d="m9 18 6-6-6-6"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  wa: '<path d="M4 20l1.3-3.9A8 8 0 1 1 8 19.2Z"/><path d="M9.2 8.6c.2-.5.6-.5.9-.5l.6.1 1 2.1-.6.9c.5 1 1.3 1.8 2.3 2.3l.9-.6 2.1 1-.1.6c-.1.4-.6 1-1.4 1-2.6 0-5.8-3.1-5.8-5.8 0-.4 0-.8.1-1.1Z"/>',
  down: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>', up: '<path d="M12 20V9M7 14l5-5 5 5M5 4h14"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  lock: '<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>',
  back: '<path d="M15 18l-6-6 6-6"/>'
};
function ic(n, s) { return '<svg viewBox="0 0 24 24" width="' + (s || 20) + '" height="' + (s || 20) + '" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[n] + '</svg>'; }

/* ================= data, saved on this device ================= */
var KEY = 'proSmashAttendance.v1';
function blank() {
  return {academy: 'Pro Smash Badminton Academy',
    batches: [{id: 'b1', name: 'Beginner', time: ''}, {id: 'b2', name: 'Intermediate', time: ''}, {id: 'b3', name: 'Advance 1', time: ''}, {id: 'b4', name: 'Advance pro', time: ''}],
    students: [], att: {}, notes: {}, sent: {}, lang: 'en', lastBackup: '', started: TODAY};
}
function fix(d) {
  var b = blank();
  if (!d || typeof d !== 'object') return b;
  ['academy', 'lang', 'lastBackup', 'started'].forEach(function (k) { if (typeof d[k] !== 'string') d[k] = b[k]; });
  if (!Array.isArray(d.batches)) d.batches = b.batches;
  if (!Array.isArray(d.students)) d.students = [];
  ['att', 'notes', 'sent'].forEach(function (k) { if (!d[k] || typeof d[k] !== 'object') d[k] = {}; });
  d.students = d.students.filter(function (s) { return s && s.id && s.name; });
  return d;
}
var storageOK = true, D;
try { D = fix(JSON.parse(localStorage.getItem(KEY) || 'null')); } catch (e) { storageOK = false; D = blank(); }
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(D)); storageOK = true; }
  catch (e) { storageOK = false; toast('Couldn’t save on this phone. Download a backup from Settings now.'); }
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
window.addEventListener('storage', function (e) { if (e.key === KEY) { try { D = fix(JSON.parse(e.newValue || 'null')); render(); } catch (x) {} } });

/* ================= shared register (Google Sheet) + PIN lock ================= */
var CONN_KEY = 'proSmashAttendance.conn', OUT_KEY = 'proSmashAttendance.outbox', LPIN_KEY = 'proSmashAttendance.localPin';
var APP_URL = location.href.split('#')[0].split('?')[0];
function readJSON(k, d) { try { var v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } }
function writeJSON(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
var CONN = readJSON(CONN_KEY, null);          // {url, verifier:{salt,hash,ver}, sheetUrl, from, extra:{month:1}}
var OUTBOX = readJSON(OUT_KEY, []);           // changes waiting to reach the Google Sheet
var LPIN = readJSON(LPIN_KEY, null);          // {salt, hash} when used on this phone only
var SES = {unlocked: false, token: null, pin: null, online: null, hiddenAt: 0, flushing: false};
function shared() { return !!(CONN && CONN.url); }
function saveConn() { writeJSON(CONN_KEY, CONN); }
function saveOutbox() { writeJSON(OUT_KEY, OUTBOX.map(function (o) { return {action: o.action, data: o.data, id: o.id}; })); }
function validExec(u) { return /^https:\/\/script\.google\.com\/(a\/macros\/[^\/]+|macros)\/s\/[A-Za-z0-9_-]{20,}\/exec\/?$/.test(String(u || '').trim()); }

/* PIN check that also works offline: a salted hash, never the PIN itself */
function hashPin(pin, salt) {
  var text = salt + ':' + pin;
  if (window.crypto && crypto.subtle && window.TextEncoder) {
    var enc = new TextEncoder(), round = function (s, n) {
      return crypto.subtle.digest('SHA-256', enc.encode(s + salt)).then(function (buf) {
        var h = Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
        return n > 1 ? round(h, n - 1) : h;
      });
    };
    return round(text, 500);
  }
  var h = 2166136261; for (var r = 0; r < 500; r++) for (var i = 0; i < text.length; i++) { h ^= text.charCodeAt(i) + r; h = Math.imul(h, 16777619) >>> 0; }
  return Promise.resolve('f' + h.toString(16));
}
function makeVerifier(pin, ver) { var salt = rid('v'); return hashPin(pin, salt).then(function (h) { return {salt: salt, hash: h, ver: ver || 0}; }); }
function checkVerifier(v, pin) { return v ? hashPin(pin, v.salt).then(function (h) { return h === v.hash; }) : Promise.resolve(false); }

/* talking to the Google Sheet connector */
function api(action, data, url) {
  var ctl = window.AbortController ? new AbortController() : null, timer = ctl ? setTimeout(function () { ctl.abort(); }, 25000) : 0;
  return fetch(url || CONN.url, {method: 'POST', body: JSON.stringify({action: action, token: SES.token, data: data || {}}), signal: ctl ? ctl.signal : undefined, redirect: 'follow'})
    .then(function (res) { return res.text(); }, function () { throw {error: 'network'}; })
    .then(function (txt) { clearTimeout(timer); try { return JSON.parse(txt); } catch (e) { throw {error: 'bad_link'}; } });
}
function getToken() {
  if (!SES.pin) return Promise.reject({error: 'no_pin_in_memory'});
  return api('unlock', {pin: SES.pin}).then(function (r) {
    if (!r.ok) throw r;
    SES.token = r.token;
    if (!CONN.verifier || CONN.verifier.ver !== r.pinVer) return makeVerifier(SES.pin, r.pinVer).then(function (v) { CONN.verifier = v; saveConn(); });
  });
}

/* every change is applied here first, then queued for the Google Sheet */
function applyOp(op) {
  var d = op.data;
  if (op.action === 'mark') {
    var day = D.att[d.date] = D.att[d.date] || {};
    Object.keys(d.changes).forEach(function (k) { var v = d.changes[k]; if (v === 'P' || v === 'A') day[k] = v; else delete day[k]; });
    if (!Object.keys(day).length) delete D.att[d.date];
  } else if (op.action === 'saveStudents') {
    d.students.forEach(function (s) { var i = D.students.findIndex(function (x) { return x.id === s.id; }); if (i >= 0) D.students[i] = Object.assign({}, D.students[i], s); else D.students.push(Object.assign({}, s)); });
  } else if (op.action === 'removeStudent') {
    D.students = D.students.filter(function (s) { return s.id !== d.id; });
  } else if (op.action === 'saveSettings') {
    D.academy = d.academy; D.batches = d.batches; D.lang = d.lang;
  } else if (op.action === 'note') {
    var nm = D.notes[d.month] = D.notes[d.month] || {}; if (d.text) nm[d.sid] = d.text; else delete nm[d.sid];
  } else if (op.action === 'sent') {
    (D.sent[d.month] = D.sent[d.month] || {})[d.sid] = d.date;
  }
}
function act(action, data) {
  var op = {action: action, data: data, id: rid('o')};
  applyOp(op); save();
  if (!shared()) return;
  var last = OUTBOX[OUTBOX.length - 1];
  if (action === 'mark' && last && last.action === 'mark' && !last.inflight && last.data.date === data.date) Object.assign(last.data.changes, data.changes);
  else {
    if (action === 'note') OUTBOX = OUTBOX.filter(function (o) { return o.inflight || !(o.action === 'note' && o.data.month === data.month && o.data.sid === data.sid); });
    OUTBOX.push(op);
  }
  saveOutbox(); flushSoon(); updateSync();
}
var flushTimer;
function flushSoon(ms) { clearTimeout(flushTimer); flushTimer = setTimeout(flush, ms == null ? 700 : ms); }
function flush() {
  if (SES.flushing || !shared() || !SES.unlocked || !OUTBOX.length) { updateSync(); return Promise.resolve(); }
  SES.flushing = true; updateSync();
  var busy = 0;
  function step() {
    if (!OUTBOX.length) return Promise.resolve();
    var op = OUTBOX[0]; op.inflight = true;
    return api(op.action, op.data).then(function (r) {
      if (r.ok) { OUTBOX.shift(); saveOutbox(); SES.online = true; return step(); }
      if (r.error === 'auth') { SES.token = null; return getToken().then(step); }
      if (r.error === 'busy' && busy++ < 3) return new Promise(function (ok) { setTimeout(ok, 1500); }).then(step);
      OUTBOX.shift(); saveOutbox(); toast('One change couldn’t be saved online (' + r.error + ').'); return step();
    });
  }
  var start = SES.token ? Promise.resolve() : getToken();
  return start.then(step).then(function () { SES.online = true; }, function (e) {
    if (e && e.error === 'network') SES.online = false;
    else if (e && (e.error === 'wrong' || e.error === 'no_pin')) lockApp(e.error === 'no_pin' ? 'The PIN was reset. Create a new PIN.' : 'The PIN was changed. Enter the new PIN.');
  }).then(function () {
    OUTBOX.forEach(function (o) { delete o.inflight; });
    SES.flushing = false; updateSync();
    if (OUTBOX.length && SES.online) flushSoon(3000);
  });
}
function pull() {
  if (!shared() || !SES.unlocked) return Promise.resolve();
  var from = addMonths(CUR, -2);
  var go = function () { return api('load', {from: from}); };
  return (SES.token ? go() : getToken().then(go)).then(function (r) {
    if (!r.ok && r.error === 'auth') { SES.token = null; return getToken().then(go); }
    return r;
  }).then(function (r) {
    if (!r || !r.ok) return;
    SES.online = true;
    var extra = CONN.extra || {}, att = {}, notes = {}, sent = {};
    Object.keys(D.att).forEach(function (k) { if (k.slice(0, 7) < r.from && extra[k.slice(0, 7)]) att[k] = D.att[k]; });
    ['notes', 'sent'].forEach(function (key) { Object.keys(D[key]).forEach(function (m) { if (m < r.from && extra[m]) (key === 'notes' ? notes : sent)[m] = D[key][m]; }); });
    D.academy = r.academy || D.academy; D.batches = r.batches || []; D.lang = r.lang || 'en';
    D.students = (r.students || []).map(function (s) { return {id: s.id, name: s.name, batch: s.batch, parentName: s.parentName, phone: s.phone, joined: s.joined}; });
    D.att = Object.assign(att, r.att || {}); D.notes = Object.assign(notes, r.notes || {}); D.sent = Object.assign(sent, r.sent || {});
    OUTBOX.forEach(applyOp);
    CONN.sheetUrl = r.sheetUrl; CONN.from = r.from; saveConn(); save();
    render(); if (U.sheet && U.sheet.type !== 'student' && U.sheet.type !== 'many' && U.sheet.type !== 'settings') renderSheet();
  }, function (e) { if (e && e.error === 'network') SES.online = false; else if (e && (e.error === 'wrong' || e.error === 'no_pin')) lockApp(e.error === 'no_pin' ? 'The PIN was reset. Create a new PIN.' : 'The PIN was changed. Enter the new PIN.'); })
    .then(updateSync);
}
var monthLoading = {};
function needMonth(m) {
  if (!shared() || !CONN.from || m >= CONN.from || (CONN.extra && CONN.extra[m])) return 'ready';
  if (monthLoading[m]) return 'loading';
  monthLoading[m] = true;
  var go = function () { return api('attMonth', {month: m}); };
  (SES.token ? go() : getToken().then(go)).then(function (r) {
    if (!r.ok) throw r;
    Object.keys(r.att || {}).forEach(function (k) { D.att[k] = r.att[k]; });
    D.notes[m] = r.notes || {}; D.sent[m] = r.sent || {};
    CONN.extra = CONN.extra || {}; CONN.extra[m] = 1; saveConn(); save();
  }).catch(function () { toast('Connect to the internet to see ' + mLabel(m) + '.'); }).then(function () { monthLoading[m] = false; render(); });
  return 'loading';
}
function updateSync() {
  var el = $('#sync'); if (!el) return;
  el.hidden = !SES.unlocked;
  if (!shared()) { el.className = 'sync local'; el.innerHTML = '<i></i>This phone only'; return; }
  var n = OUTBOX.length;
  if (SES.online === false) { el.className = 'sync off'; el.innerHTML = '<i></i>Offline' + (n ? ' · ' + n + ' waiting' : ''); }
  else if (n || SES.flushing) { el.className = 'sync wait'; el.innerHTML = '<i></i>Saving…'; }
  else { el.className = 'sync'; el.innerHTML = '<i></i>Synced'; }
}
window.addEventListener('online', function () { SES.online = null; flushSoon(200); pull(); });
window.addEventListener('offline', function () { SES.online = false; updateSync(); });
setInterval(function () { if (shared() && SES.unlocked && document.visibilityState === 'visible') { if (OUTBOX.length) flush(); else pull(); } }, 60000);

/* ---------- the lock + setup screens ---------- */
var G = {screen: 'loading', mode: 'enter', first: '', entry: '', msg: '', info: '', busy: false, code: '', importOffer: false};
function showGate() { $('#gate').hidden = false; document.body.style.overflow = 'hidden'; renderGate(); }
function hideGate() { $('#gate').hidden = true; document.body.style.overflow = ''; }
function lockApp(msg) {
  SES.unlocked = false; SES.token = null; SES.pin = null; closeSheet();
  G.screen = 'pin'; G.mode = 'enter'; G.entry = ''; G.first = ''; G.msg = msg || ''; G.info = '';
  if (msg && /reset/i.test(msg)) G.mode = 'create';
  showGate(); updateSync();
}
function gateLogo() { return '<img class="gate-logo" src="icon-192.png" alt="" onerror="this.remove()">'; }
function renderGate() {
  var el = $('#gate-in'), h = '';
  if (G.screen === 'welcome') {
    h = gateLogo() + '<h2>Pro Smash Attendance</h2><p class="lead">How will you use this app?</p>' +
      '<button class="choice main" data-act="g-owner"><b>I’m the owner. Set up the shared register.</b><span>One register for all staff, saved in a Google Sheet on your Gmail. Takes about 5 minutes on a computer.</span></button>' +
      '<button class="choice" data-act="g-join"><b>I’m staff. I have an invite link.</b><span>Open the link the owner sent you on WhatsApp, or paste it here.</span></button>' +
      '<button class="choice" data-act="g-local"><b>Use on this phone only</b><span>No sharing. Data stays on this phone, protected by a PIN.</span></button>';
  } else if (G.screen === 'owner') {
    h = '<button class="btn ghost small" data-act="g-welcome" style="align-self:flex-start">' + ic('back', 16) + ' Back</button>' +
      '<h2>Set up the shared register</h2><p class="lead">Do this once, on a computer. Use your <b>second Gmail</b>.</p>' +
      '<ol class="steps-list">' +
      '<li><b>Open Google Apps Script</b>Sign in with your second Gmail. A new project opens.<br><a class="btn small" style="margin-top:8px" href="https://script.google.com/home/projects/create" target="_blank" rel="noopener">Open script.google.com</a></li>' +
      '<li><b>Paste the connector code</b>Tap Copy, then in the editor press Ctrl+A and Ctrl+V, then Ctrl+S to save.<br><button class="btn small primary" style="margin-top:8px" data-act="g-copy-code">' + ic('copy', 16) + ' Copy connector code</button>' +
        '<textarea class="code-box" id="g-code" readonly spellcheck="false" aria-label="Connector code" style="margin-top:8px">' + esc(G.code || 'Loading…') + '</textarea></li>' +
      '<li><b>Deploy it</b>Click <b>Deploy → New deployment</b>, the gear icon → <b>Web app</b>. Set <b>Execute as: Me</b> and <b>Who has access: Anyone</b>. Click <b>Deploy</b>, then <b>Authorize access</b> → your Gmail → <b>Advanced</b> → <b>Go to … (unsafe)</b> → <b>Allow</b>.</li>' +
      '<li><b>Paste the Web app link here</b>It starts with https://script.google.com/macros/s/ and ends with /exec.' +
        '<input class="inp" id="g-url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" style="margin-top:8px"></li></ol>' +
      (G.msg ? '<p class="pin-msg" role="alert">' + esc(G.msg) + '</p>' : '') +
      '<button class="btn primary block" data-act="g-connect"' + (G.busy ? ' disabled' : '') + '>' + (G.busy ? 'Connecting…' : 'Connect') + '</button>';
  } else if (G.screen === 'join') {
    h = '<button class="btn ghost small" data-act="g-welcome" style="align-self:flex-start">' + ic('back', 16) + ' Back</button>' +
      gateLogo() + '<h2>Join your academy</h2><p class="lead">Paste the invite link the owner sent you. Then enter the academy PIN.</p>' +
      '<input class="inp" id="g-join" placeholder="Paste the invite link" autocomplete="off">' +
      (G.msg ? '<p class="pin-msg" role="alert">' + esc(G.msg) + '</p>' : '') +
      '<button class="btn primary block" data-act="g-join-go"' + (G.busy ? ' disabled' : '') + '>' + (G.busy ? 'Connecting…' : 'Join') + '</button>';
  } else if (G.screen === 'import') {

  if (withAll) h += '<button class="chip" data-act="' + act + '" data-v="all" aria-pressed="' + (cur === 'all') + '">All<span>' + counts('all') + '</span></button>';
  D.batches.forEach(function (b) { h += '<button class="chip" data-act="' + act + '" data-v="' + esc(b.id) + '" aria-pressed="' + (cur === b.id) + '">' + esc(b.name) + '<span>' + counts(b.id) + '</span></button>'; });
  var nb = counts('none');
  if (nb) h += '<button class="chip" data-act="' + act + '" data-v="none" aria-pressed="' + (cur === 'none') + '">No batch<span>' + nb + '</span></button>';
  return h;
}
function countIn(list) { return function (b) { return list.filter(function (s) { return b === 'all' ? true : b === 'none' ? !batchById(s.batch) : s.batch === b; }).length; }; }

/* ================= messages ================= */
function parentMsg(s, m, note, lang) {
  var st = stats(s, m), hi = lang === 'hi', ac = D.academy || 'Academy', L = [], absDays = st.absent.join(', ');
  L.push('*' + ac + '*');

    L.push('मासिक उपस्थिति रिपोर्ट – ' + mLabelHi(m), '');
    L.push('नमस्ते' + (s.parentName ? ' ' + s.parentName + ' जी' : '') + ',');
    L.push(mLabelHi(m) + ' में ' + firstName(s.name) + ' की उपस्थिति:', '');
    L.push('खिलाड़ी: ' + s.name, 'बैच: ' + batchName(s.batch), '');
    if (st.total) {
      L.push('✅ उपस्थित: ' + st.P + ' क्लास', '❌ अनुपस्थित: ' + st.A + ' क्लास' + (st.A ? ' (' + absDays + ' ' + MONTH_HI[Number(m.slice(5)) - 1] + ')' : ''), '📊 उपस्थिति: *' + st.pct + '%*');
    } else L.push('इस महीने कोई उपस्थिति दर्ज नहीं है।');

    L.push('Here is ' + firstName(s.name) + '’s attendance for ' + mLabel(m) + ':', '');
    L.push('Player: ' + s.name, 'Batch: ' + batchName(s.batch), '');
    if (st.total) {
      L.push('✅ Present: ' + st.P + ' classes', '❌ Absent: ' + st.A + ' classes' + (st.A ? ' (' + absDays + ' ' + MON[Number(m.slice(5)) - 1] + ')' : ''), '📊 Attendance: *' + st.pct + '%*');

function groupMsg(b, m, lang) {

    '<button class="btn" style="flex:1" data-act="csv">' + ic('down', 18) + ' Download Excel</button></div>';
  h += '<p class="hint">' + (grp ? '“Send to group” opens WhatsApp with this batch’s attendance list typed. Choose the batch group and press send.' : 'Pick a batch above to send its attendance list to that batch’s WhatsApp group.') + '</p>';

function csvFor(m, b) {
  var rows = sorted(monthRoll(m).filter(function (s) { return inBatch(s, b); })), n = lastDay(m);
  function q(v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
  var head = ['Student', 'Batch', 'Parent phone']; for (var i = 1; i <= n; i++) head.push(String(i)); head.push('Present', 'Absent', 'Attendance %');
  var out = [head.map(q).join(',')];
  rows.forEach(function (s) {
    var st = stats(s, m), r = [s.name, batchName(s.batch), s.phone || ''];
    for (var j = 1; j <= n; j++) r.push(marks(m + '-' + pad(j))[s.id] || '');
    r.push(st.P, st.A, st.pct == null ? '' : st.pct);
    out.push(r.map(q).join(','));
  });
  return '﻿' + out.join('\r\n');
}

function batchRow(b) { return '<div class="batch-row" data-bid="' + esc(b.id) + '"><input class="inp" aria-label="Batch name" placeholder="Batch name" value="' + esc(b.name) + '"><input class="inp" aria-label="Timing" placeholder="Timing (optional)" value="' + esc(b.time || '') + '"><button type="button" class="x" data-act="rm-batch" aria-label="Remove batch">' + ic('x', 16) + '</button></div>'; }

function backup() {
  function finish(data, note) {
    D.lastBackup = TODAY; save();
    data.lastBackup = TODAY;
    if (download('pro-smash-attendance-backup-' + TODAY + '.json', JSON.stringify(data), 'application/json')) toast(note || 'Backup downloaded. Keep it somewhere safe.');
    render(); if (U.sheet && U.sheet.type === 'settings') renderSheet();
  }
  if (!shared()) { finish(JSON.parse(JSON.stringify(D))); return; }
  var go = function () { return api('exportAll', {}); };
  toast('Preparing the full backup…');
  (SES.token ? go() : getToken().then(go)).then(function (r) {
    if (!r.ok) throw r;
    finish(fix(r.data));
  }).catch(function () { finish(JSON.parse(JSON.stringify(D)), 'Offline: downloaded what’s on this phone. Try again online for the full backup.'); });
}
document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t) return;
  var a = t.dataset.act, id = t.dataset.id, v = t.dataset.v;
  switch (a) {
    case 'tab': U.tab = v; closeSheet(); render(); window.scrollTo(0, 0); break;
    case 'go-students': U.tab = 'students'; render(); break;
    case 'close': closeSheet(); break;
    case 'settings': openSheet('settings'); break;
    case 'mb': U.mb = v; render(); break;
    case 'rb': U.rb = v; render(); break;
    case 'sb': U.sb = v; render(); break;
    case 'stb': U.stb = v; render(); break;
    case 'day-prev': U.date = addDays(U.date, -1); render(); break;
    case 'day-next': if (U.date < TODAY) U.date = addDays(U.date, 1); render(); break;
    case 'reg-prev': U.rm = addMonths(U.rm, -1); render(); break;

    case 'send-prev': U.sm = addMonths(U.sm, -1); render(); break;
    case 'send-next': if (U.sm < CUR) U.sm = addMonths(U.sm, 1); render(); break;
    case 'reg-day': U.date = t.dataset.d; U.mb = U.rb; U.tab = 'mark'; render(); window.scrollTo(0, 0); break;
    case 'mark': {
      var cur = marks(U.date)[id], ch = {}; ch[id] = cur === v ? '' : v;
      act('mark', {date: U.date, changes: ch}); render(); break;
    }
    case 'all-present': {
      var dd = marks(U.date), chs = {}, n = 0;
      D.students.forEach(function (s) { if (onRoll(s, U.date) && inBatch(s, U.mb) && !dd[s.id]) { chs[s.id] = 'P'; n++; } });
      if (n) act('mark', {date: U.date, changes: chs});
      render(); toast(n + ' marked present'); break;
    }
    case 'csv': {
      var nm = (U.rb === 'all' ? 'all-batches' : batchName(U.rb).toLowerCase().replace(/[^a-z0-9]+/g, '-')) + '-' + U.rm;
      if (download('attendance-' + nm + '.csv', csvFor(U.rm, U.rb), 'text/csv;charset=utf-8')) toast('Downloaded. It opens in Excel or Google Sheets.');
      break;
    }
    case 'open-send': openSend(id); break;
    case 'lang': if (U.draft) { U.draft.lang = v; renderSheet(); } break;
    case 'copy-msg': { var s0 = byId(U.sheet.id); if (s0) copyText(parentMsg(s0, U.sm, U.draft.note, U.draft.lang)); break; }
    case 'sent': {
      var s1 = U.sheet && byId(U.sheet.id);
      if (!s1 || !s1.phone) { e.preventDefault(); break; }
      t.href = waLink(s1.phone, parentMsg(s1, U.sm, U.draft.note, U.draft.lang));
      act('sent', {month: U.sm, sid: s1.id, date: TODAY});
      setTimeout(function () { renderSheet(); render(); }, 400);

    }
    case 'add-student': openSheet('student', {}); setTimeout(function () { var f = $('#f-name'); if (f) f.focus(); }, 50); break;
    case 'add-many': openSheet('many'); break;
    case 'edit-student': openSheet('student', {id: id}); break;
    case 'ask-delete': U.confirm = true; renderSheet(); break;
    case 'cancel-confirm': U.confirm = false; renderSheet(); break;
    case 'delete-student': {

    }
    case 'lock-now': lockApp(); break;

document.addEventListener('submit', function (e) {
  e.preventDefault();
  var f = e.target;
  if (f.id === 'f-student') {
    var name = $('#f-name').value.trim();
    if (!name) { toast('Enter the player’s name.'); $('#f-name').focus(); return; }
    var rec = {id: f.dataset.id || rid('s'), name: name, batch: $('#f-batch').value, joined: $('#f-joined').value || TODAY, parentName: $('#f-pname').value.trim(), phone: $('#f-phone').value.trim()};
    act('saveStudents', {students: [rec]}); toast(f.dataset.id ? 'Saved' : name + ' added');
    closeSheet(); render();
  } else if (f.id === 'f-many') {
    var b = $('#m-batch').value, list = [];
    $('#m-text').value.split(/\r?\n/).forEach(function (line) {
      line = line.trim(); if (!line) return;
      var ph = (line.match(/(\+?\d[\d\s-]{8,}\d)/) || [''])[0], nm = line.replace(ph, '').replace(/[,;|\t-]+\s*$/, '').replace(/^\d+[.)]\s*/, '').replace(/[,;|\t]+/g, ' ').trim();
      if (!nm) return;
      list.push({id: rid('s') + list.length, name: nm, batch: b, joined: TODAY, parentName: '', phone: ph.trim()});
    });
    if (!list.length) { toast('Paste at least one name.'); return; }
    act('saveStudents', {students: list});
    closeSheet(); U.stb = b || 'all'; render(); toast(list.length + ' students added to ' + batchName(b));
  } else if (f.id === 'f-settings') {
    var batches = [];
    f.querySelectorAll('.batch-row').forEach(function (r) { var ins = r.querySelectorAll('input'), n = ins[0].value.trim(); if (n) batches.push({id: r.dataset.bid, name: n, time: ins[1].value.trim()}); });
    act('saveSettings', {academy: $('#st-name').value.trim() || 'My academy', batches: batches, lang: $('#st-hi').getAttribute('aria-pressed') === 'true' ? 'hi' : 'en'});
    closeSheet(); render(); toast('Settings saved');
  } else if (f.id === 'f-pin') {
    var oldp = $('#cp-old').value.trim(), newp = $('#cp-new').value.trim();
    if (!/^\d{4}$/.test(newp)) { toast('The new PIN must be 4 digits.'); return; }
    var btn = f.querySelector('[type=submit]'); btn.disabled = true;
    if (!shared()) {
      checkVerifier(LPIN, oldp).then(function (ok) {
        if (!ok) { btn.disabled = false; toast('The current PIN is wrong.'); return; }
        return makeVerifier(newp, 0).then(function (v) { LPIN = v; writeJSON(LPIN_KEY, v); SES.pin = newp; closeSheet(); toast('PIN changed'); });
      });
      return;
    }
    var go = function () { return api('changePin', {oldPin: oldp, newPin: newp}); };
    (SES.token ? go() : getToken().then(go)).then(function (r) {
      btn.disabled = false;
      if (!r.ok) { toast(r.error === 'wrong' ? 'The current PIN is wrong.' : 'Couldn’t change the PIN (' + r.error + ').'); return; }
      SES.token = r.token; SES.pin = newp;
      return makeVerifier(newp, r.pinVer).then(function (v) { CONN.verifier = v; saveConn(); closeSheet(); toast('PIN changed. Tell your staff the new PIN.'); });
    }, function () { btn.disabled = false; toast('You need internet to change the shared PIN.'); });
  }
});

document.addEventListener('change', function (e) {
